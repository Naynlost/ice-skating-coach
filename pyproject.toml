[project]
name = "ice-skating-coach"
version = "0.1.0"
description = "Buz pateni video kocluk sistemi - olcum katmani"
requires-python = ">=3.11"
# Cekirdek bagimliliklar bilerek bos tutuldu. Her grup ilgili gorevde kurulur,
# boylece iskelet asamasinda torch/onnx gibi agir paketler gelmez.
dependencies = []

[project.optional-dependencies]
# Gorev 1.2-1.3, 1.7-1.8: sayisal hesap, video, sema
core = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]
# Gorev 1.4-1.5: tespit, takip, poz
pose = [
  "ultralytics>=8.3",
  # ByteTrack'in kimlik atama adimi buna bagli. Acikca yaziyoruz cunku
  # eksikse ultralytics calisma aninda kendisi kurmaya calisiyor.
  "lap>=0.5.12",
  "rtmlib>=0.0.13",
  "onnxruntime>=1.17",
]
# Faz 3-4: rapor ve servis
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "anthropic>=0.40",
  "jinja2>=3.1",
]
dev = [
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "elements"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "ANN",      # tip ipuclari zorunlu
  "RET",      # return sadeligi
  "SIM",      # sadelestirme
  "PTH",      # pathlib
]
ignore = [
  "ANN401",  # Any bazen kacinilmaz
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"elements/*/tests/**" = ["ANN"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["core", "elements", "tests", "conftest.py"]

# Ucuncu parti paketlerin cogunda tip taslagi yok
[[tool.mypy.overrides]]
module = ["cv2.*", "ultralytics.*", "rtmlib.*", "scipy.*", "yaml.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests", "elements"]
python_files = ["test_*.py"]
addopts = "-q"
